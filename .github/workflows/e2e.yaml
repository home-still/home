name: Scribe E2E

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "scribe-server image tag"
        default: "latest"
        type: string
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 04:00 UTC

permissions:
  contents: read
  packages: read

env:
  SCRIBE_IMAGE: ghcr.io/home-still/hs-scribe-server
  LAYOUT_MODEL_URL: https://github.com/home-still/home/releases/download/v0.0.1-rc.39/pp-doclayoutv3.onnx
  TABLE_MODEL_URL: https://github.com/home-still/home/releases/download/v0.0.1-rc.39/slanet-plus.onnx
  # sha256 of the two assets above, as computed by GitHub for the release.
  # A model that changes (re-uploaded asset) fails the run instead of being
  # fed to the scribe image.
  LAYOUT_MODEL_SHA256: d24809294b2f9f1a9a2767043a64df2714b66e5be056887be2233d1117d784f6
  TABLE_MODEL_SHA256: d57a942af6a2f57d6a4a0372573c696a2379bf5857c45e2ac69993f3b334514b

jobs:
  e2e:
    name: Scribe end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download models
        run: |
          mkdir -p /tmp/models
          curl -fSL -o /tmp/models/pp-doclayoutv3.onnx "$LAYOUT_MODEL_URL"
          curl -fSL -o /tmp/models/slanet-plus.onnx    "$TABLE_MODEL_URL"
          echo "$LAYOUT_MODEL_SHA256  /tmp/models/pp-doclayoutv3.onnx" | sha256sum -c -
          echo "$TABLE_MODEL_SHA256  /tmp/models/slanet-plus.onnx" | sha256sum -c -
          ls -lh /tmp/models/

      - name: Create test PDF
        run: |
          # Generate a minimal 1-page PDF with text content
          sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript >/dev/null 2>&1
          cat > /tmp/test.ps << 'POSTSCRIPT'
          %!PS
          /Helvetica findfont 24 scalefont setfont
          72 700 moveto (Attention Is All You Need) show
          /Helvetica findfont 14 scalefont setfont
          72 660 moveto (Ashish Vaswani, Noam Shazeer, Niki Parmar) show
          72 640 moveto (Google Brain) show
          /Helvetica findfont 11 scalefont setfont
          72 600 moveto (Abstract) show
          72 580 moveto (The dominant sequence transduction models are based on) show
          72 565 moveto (complex recurrent or convolutional neural networks that) show
          72 550 moveto (include an encoder and a decoder. We propose a new simple) show
          72 535 moveto (network architecture, the Transformer, based solely on) show
          72 520 moveto (attention mechanisms.) show
          showpage
          POSTSCRIPT
          gs -sDEVICE=pdfwrite -dNOPAUSE -dBATCH -dQUIET \
            -sOutputFile=/tmp/test.pdf /tmp/test.ps
          ls -lh /tmp/test.pdf

      - name: Start services
        env:
          # Untrusted workflow_dispatch input: reaches the shell only through
          # the environment, and only after it matches the docker tag grammar.
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "FAIL: image_tag is not a valid docker tag" >&2
            exit 1
          fi
          export SCRIBE_TAG="$IMAGE_TAG"
          export MODELS_DIR=/tmp/models
          docker compose \
            -f crates/hs-scribe/docker/docker-compose.e2e.yml \
            up -d

      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama..."
          for i in $(seq 1 30); do
            if docker exec ollama-e2e ollama list >/dev/null 2>&1; then
              echo "Ollama is up"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 5
          done
          echo "FAIL: Ollama did not come up within 150s" >&2
          exit 1

      - name: Pull VLM model
        run: |
          echo "Pulling moondream model (~1GB, fast on CPU)..."
          docker exec ollama-e2e ollama pull moondream
          echo "Model pull complete:"
          docker exec ollama-e2e ollama list

      - name: Wait for scribe-server health
        run: |
          echo "Waiting for scribe-server..."
          for i in $(seq 1 30); do
            RESP=$(curl -sf http://localhost:7432/health 2>/dev/null || true)
            if echo "$RESP" | grep -q '"status":"ok"'; then
              echo "scribe-server healthy: $RESP"
              break
            fi
            echo "  attempt $i/30..."
            sleep 5
          done
          # Hard fail if not healthy
          curl -sf http://localhost:7432/health | grep '"status":"ok"'

      - name: Convert test PDF
        run: |
          echo "Sending test PDF to /scribe..."
          HTTP_CODE=$(curl -sf -o /tmp/result.md -w "%{http_code}" \
            -X POST http://localhost:7432/scribe \
            -F "pdf=@/tmp/test.pdf" \
            --max-time 600)
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: expected 200, got $HTTP_CODE"
            cat /tmp/result.md || true
            exit 1
          fi
          echo "--- Output (first 50 lines) ---"
          head -50 /tmp/result.md

      - name: Validate output
        run: |
          if [ ! -s /tmp/result.md ]; then
            echo "FAIL: output is empty"
            exit 1
          fi

          CHARS=$(wc -c < /tmp/result.md)
          echo "Output size: $CHARS bytes"
          if [ "$CHARS" -lt 100 ]; then
            echo "FAIL: output too short ($CHARS bytes)"
            cat /tmp/result.md
            exit 1
          fi

          if grep -qE '^#|[a-zA-Z]{4,}' /tmp/result.md; then
            echo "PASS: output contains text content"
          else
            echo "FAIL: output does not look like markdown"
            cat /tmp/result.md
            exit 1
          fi

          echo "E2E test passed."

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scribe-e2e-output
          path: /tmp/result.md
          retention-days: 7

      - name: Logs on failure
        if: failure()
        run: |
          docker compose \
            -f crates/hs-scribe/docker/docker-compose.e2e.yml \
            logs --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f crates/hs-scribe/docker/docker-compose.e2e.yml \
            down -v --remove-orphans
