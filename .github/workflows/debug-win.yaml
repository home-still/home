name: debug windows full test set (do not merge)
on:
  push:
    branches: ["debug/win-openalex"]
permissions:
  contents: read
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace --exclude hs-scribe --no-run
      - name: full test set, no fail-fast
        timeout-minutes: 30
        run: cargo test --locked --workspace --exclude hs-scribe --no-fail-fast
