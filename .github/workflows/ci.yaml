name: Home Still Build

on:
  push:
    branches: [main]
  pull_request:
  # release.yaml runs exactly this workflow as its gate, so a tag cannot be
  # published on gates weaker than the ones every push to main passed.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always


jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same runner images release.yaml ships from, so the gate compiles
        # on the toolchain/SDK the artifacts are built with (no floating
        # `*-latest`).
        #
        # windows-2022 (VS2022), NOT windows-latest: GitHub repointed
        # `windows-latest` and `windows-2025` to the VS2026 image, whose
        # MSVC dropped `stdext::checked_array_iterator` — DuckDB's
        # vendored `fmt` still uses it, so the bundled `libduckdb-sys`
        # build dies in cc-rs (`cl.exe` exit 2). Every crate but
        # hs-scribe pulls duckdb, so the whole leg failed. release.yaml
        # pinned the same runner for the same reason (rc.336/rc.337).
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # hs-scribe's pdfium-backed tests print SKIPPED without libpdfium, and
      # the scribe server needs it at startup. Same release the scribe image
      # pins (crates/hs-scribe/docker/Dockerfile PDFIUM_VERSION); sha256 is
      # the GitHub-computed asset digest:
      #   gh api repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F7749 \
      #     --jq '.assets[]|select(.name=="pdfium-linux-x64.tgz")|.digest'
      - name: Install libpdfium (linux-x64)
        if: matrix.os == 'ubuntu-24.04'
        env:
          PDFIUM_URL: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7749/pdfium-linux-x64.tgz
          PDFIUM_SHA256: 735abb28af7deab720dc54c8df3673a0a2a57bae9a0b16288842695fbd90a4b9
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pdfium.tgz" "$PDFIUM_URL"
          echo "$PDFIUM_SHA256  $RUNNER_TEMP/pdfium.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pdfium"
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium"
          test -f "$RUNNER_TEMP/pdfium/lib/libpdfium.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pdfium/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # --all: every workspace member, not a hand-kept list of them.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --exclude hs-scribe --all-targets -- -D warnings
      - run: cargo clippy --locked -p hs-scribe -- -D warnings
      - run: cargo test --locked --workspace --exclude hs-scribe

      # `hs-scribe --features server` and `hs-distill --features server`/`cuda`
      # are not part of the workspace invocations above (the `server`-gated
      # modules — qdrant, server, embed::onnx, the HTTP handlers — only
      # compile with the feature). Linux only: that is where release.yaml
      # builds the distill server; the scribe server is also checked on macOS
      # below because release.yaml ships it from there too.
      - run: cargo clippy --locked -p hs-scribe --features server --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo test --locked -p hs-scribe --features server
        if: matrix.os == 'ubuntu-24.04'
      # `eval` (implies `server`) is the OCR benchmark harness; nothing ships
      # it, so only its own modules' lints and tests are gated here.
      - run: cargo clippy --locked -p hs-scribe --features eval --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo test --locked -p hs-scribe --features eval --lib eval
        if: matrix.os == 'ubuntu-24.04'
      # Exactly the feature set release.yaml builds for hs-distill-server
      # (`--features cuda`, which implies `server`). Compiling is the point:
      # it needs no GPU, but it does need the pyke ORT CUDA bundle download
      # that the release build also performs.
      - run: cargo clippy --locked -p hs-distill --features cuda --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo test --locked -p hs-distill --features server --lib
        if: matrix.os == 'ubuntu-24.04'
      # The macOS scribe server release artifact (aarch64-apple-darwin).
      - run: cargo check --locked -p hs-scribe --features server --bin hs-scribe-server
        if: matrix.os == 'macos-14'
