name: Home Still Build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always


jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (VS2022), NOT windows-latest: GitHub repointed
        # `windows-latest` and `windows-2025` to the VS2026 image, whose
        # MSVC dropped `stdext::checked_array_iterator` — DuckDB's
        # vendored `fmt` still uses it, so the bundled `libduckdb-sys`
        # build dies in cc-rs (`cl.exe` exit 2). Every crate but
        # hs-scribe pulls duckdb, so the whole leg failed. release.yaml
        # pinned the same runner for the same reason (rc.336/rc.337).
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -p hs -p paper -p hs-common -p hs-scribe -p hs-distill --check      
      - run: cargo clippy --workspace --exclude hs-scribe --all-targets -- -D warnings
      - run: cargo clippy -p hs-scribe -- -D warnings
      - run: cargo clippy -p hs-scribe --features server --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test --workspace --exclude hs-scribe                     
      - run: cargo test -p hs-scribe --features server          
        if: matrix.os == 'ubuntu-latest'                                    
  