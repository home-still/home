[package]
name = "hs-common"
version = "0.1.0"
edition = "2021"

[features]
default = []
cli = [
    "dep:indicatif",
    "dep:owo-colors",
    "dep:supports-color",
    "dep:clap",
    "dep:terminal_size",
    "dep:unicode-width",
]
# Internal feature: pulled in by every other feature that uses reqwest so the
# single `http::http_client` helper is available wherever reqwest is.
http = [
    "dep:reqwest",
    "dep:anyhow",
]
# Async, TTL-cached `gpu::*_async` accessors for request handlers.
gpu-async = [
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
]
service = [
    "http",
    "gpu-async",
    "dep:async-trait",
    "dep:futures",
]
catalog = [
    "dep:chrono",
]
compose = [
    "http",
    "dep:tokio",
]
auth = [
    "http",
    "dep:hmac",
    "dep:sha2",
    "dep:base64",
    "dep:rand",
    "dep:tokio",
    "dep:http",
    "dep:subtle",
]
storage = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:futures",
    "dep:chrono",
    "dep:gethostname",
    "tokio/fs",
]
storage-s3 = [
    "storage",
    "http",
    "dep:object_store",
    "dep:bytes",
    "dep:futures",
    "dep:url",
    "dep:hmac",
    "dep:sha2",
    "dep:chrono",
]
events = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:futures",
]
events-nats = [
    "events",
    "dep:async-nats",
    "dep:bytes",
]
# `panic_guard::catch_panic` plus the axum middleware that turns a handler
# panic into a 500 (RA-5). The async helper alone needs only `events`.
catch-panic = [
    "dep:axum",
    "dep:futures",
]
logging = [
    "storage",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:gethostname",
    "dep:uuid",
    "dep:chrono",
    "dep:anyhow",
    "dep:tokio",
    "tokio/sync",
    "tokio/time",
    "tokio/fs",
    "tokio/rt",
    "tokio/macros",
]

[dependencies]
indicatif = { version = "0.18", optional = true }
owo-colors = { version = "4.3", optional = true }
supports-color = { version = "3", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
terminal_size = { version = "0.4", optional = true }
unicode-width = { version = "0.2", optional = true }
dirs = "6"

# service feature deps
reqwest = { version = "0.12", features = ["json", "multipart"], default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
async-trait = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
tracing = "0.1"

# compose feature deps
tokio = { workspace = true, optional = true }

# catalog feature deps
chrono = { version = "0.4", optional = true }

# auth feature deps
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.9", optional = true }
http = { version = "1", optional = true }
subtle = { version = "2", optional = true }

# storage-s3 feature deps
object_store = { version = "0.13", features = ["aws"], optional = true }
bytes = { version = "1", optional = true }
url = { version = "2", optional = true }

# events feature deps
async-nats = { version = "0.47", optional = true }

# catch-panic feature deps
axum = { workspace = true, optional = true }

# logging feature deps
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tracing-appender = { version = "0.2", optional = true }
gethostname = { version = "1", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
