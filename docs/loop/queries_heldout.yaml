# Held-out evaluation queries for home-still retrieval.
#
# Approved by the owner on 2026-11-26, before any of them was scored.
# No retrieval setting may be chosen with this file: it is for confirming
# a setting chosen elsewhere. A query that is changed after it has been
# scored is no longer held out.
#
# Pass rule, fixed before the first scoring: with the store at its default
# settings, the candidate finds at least as many expected documents in the
# top 10 as the baseline does in the same session. Every query the two
# disagree on is listed in the report.
#
# Same shape as queries.yaml, but every query is anchored to one document:
# it passes when `expect_doc` is among the top `limit` results.
#
# How the set was made, so it can be made again:
#   * Frame: documents held by both the Qdrant index and the myelin store,
#     with a title of at least 15 characters that no other document
#     shares, and at least 4 chunks. 13440 documents.
#   * Sample: 70 drawn with Python's random.Random(20261126).sample
#     over the sorted frame; the first 50 usable ones in draw order were
#     kept (draws 1 to 51 without draw 36).
#   * Passage: one chunk per document, chosen by
#     random.Random("20261126:<doc id>").choice over the chunks that
#     are not the first two, not the last, hold at least 1200 characters,
#     are at least 72 % letters and spaces, and are not a reference list
#     (the harness's own rule). The first 800 characters of that
#     chunk were read, and the query was written from them alone.
#     No search was run against either index while writing.
#   * Passed over: draw 36 (the passage is one phrase repeated, a failed
#     conversion).
#   * `expect` is a term checked to occur in the passage read. It is
#     recorded for the rank column; the pass is by document.
#   * Ten passages hold table cells (h02, h05, h06, h09, h19, h21, h25,
#     h37, h41, h48); they were kept, because a document's tables are
#     part of what a search must find.
#   * h35's document is in Italian and its query is in English.
#
# Groups mean what they mean in queries.yaml.

