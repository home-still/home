# Development queries for home-still retrieval: the only file a retrieval
# setting may be chosen with.
#
# Written 2026-11-26. Approved by the owner on 2026-11-27, with the choice
# rule below, before any of them was scored.
#
# What is chosen with it: the store's rerank depth, the number of fused
# records per store that the reranker scores. Three arms: 25 (myelin's
# default), 50 and 100. Nothing else differs between the arms.
#
# Choice rule, fixed before the first scoring: the arm that passes the
# most queries of this file wins; on a tie, the smaller depth. An arm that
# passes fewer of the document-anchored queries (d01 to d40) than depth 25
# cannot win. Reported with the choice: each arm's passes in each part,
# the queries it wins and loses against depth 25, and the exact sign test
# on those. Then queries.yaml and queries_heldout.yaml are each run once
# at the chosen depth, under their own rules. No second choice is made.
#
# Same shape as queries.yaml. Two parts, made differently.
#
# Part 1, d01 to d40: anchored to one document, made the way
# queries_heldout.yaml was. A query passes when `expect_doc` is among the
# top `limit` results.
#   * Frame: the held-out file's frame (documents held by both the Qdrant
#     index and the myelin store, with a title of at least 15 characters
#     that no other document shares, and at least 4 chunks) without the
#     70 documents drawn for the held-out file. 13370 documents.
#   * Sample: 160 drawn with Python's random.Random(20261127).sample
#     over the sorted frame. Draws 1 to 60 are this part's; the first
#     40 usable ones in draw order were kept (draws 1 to 41 without
#     draw 5, which has no eligible chunk). None was passed over.
#   * Passage: one chunk per document, chosen by
#     random.Random("20261127:<doc id>").choice over the chunks that
#     are not the first two, not the last, hold at least 1200 characters,
#     are at least 72 % letters and spaces, and are not a reference list
#     (the harness's own rule). The first 760 characters of that
#     chunk were read, and the query was written from them alone.
#     No search was run against either index while writing.
#   * `expect` is a term checked to occur in the passage read. It is
#     recorded for the rank column; the pass is by document.
#   * Six passages hold table cells (d01, d02, d06, d14, d28, d31); they
#     were kept, as in the held-out file.
#
# Part 2, t01 to t38: a short query on a subject, holding one word that
# is rare in the store. A query passes when a top `limit` result holds
# that word (`expect`), which is how queries.yaml judges its `literal`
# group. This part exists because of gate query q09, which was studied
# closely before it was written: it is not blind to that query's kind,
# only to the queries themselves.
#   * Documents: draws 61 to 160 of the sample above, then 340 more
#     drawn with random.Random("20261127:terms").sample over the
#     sorted frame without the first 160. 440 documents.
#   * Passage: as in part 1, with the seed string
#     "20261127:term:<doc id>". 7 documents had no eligible chunk.
#   * Candidate words: every word of the passage written in at least
#     8 lower-case letters that the store's word index finds in 3 to 30
#     chunks of the `academic` store, from at least 3 documents. That
#     count was read from the store's word index with a one-word query,
#     the only kind of search run while making this file. 287 documents
#     had no such word.
#   * Word kept: the candidates were shuffled with
#     random.Random("20261127:order:<doc id>").shuffle over the sorted
#     list, and the first one was kept that is an English noun, or a
#     chemical name, naming a substance, an organism, a body or cell
#     structure, a medical condition, a method, an instrument or an
#     object of a scientific or technical field. That is a judgement.
#     108 documents had candidates and none that fits (broken or joined
#     words such as "reatments" and "evidencebased", ordinary words such
#     as "doughnut" and "aimlessly", adjectives such as "avascular",
#     names, words of other languages). In six kept documents an earlier
#     candidate was passed over: deoxygenated, embellished, rootless,
#     frutescens, sebaceous, and superconvergence with subsubsection.
#     The kept words are found in 4 to 25 chunks, median 14.
#   * Query: three to seven words written from the kept word alone, in
#     the sense it usually has, before its passage was read. So the store
#     may hold nothing on the query's subject, as with q09. No search was
#     run against either index while writing.
#
# Groups mean what they mean in queries.yaml.

