[package]
name = "hs"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "hs"
path = "src/main.rs"

[dependencies]
hs-scribe = { path = "../hs-scribe", features = ["client"] }
hs-distill = { path = "../hs-distill", features = ["client"] }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
hs-common = { workspace = true, features = ["cli", "service", "catalog", "compose", "auth", "storage", "storage-s3", "events", "events-nats", "logging"] }
owo-colors = { workspace = true }
paper = { path = "../../paper" }
personal = { path = "../../personal" }
openalex-ingest = { path = "../openalex-ingest" }
duckdb = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
dialoguer = { workspace = true }
reqwest = { workspace = true }
notify = "8"
futures = "0.3"
tempfile = "3"
sha2 = "0.10"
libc = "0.2"
tracing = { workspace = true }
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "3", default-features = false, features = ["deflate"] }

[dev-dependencies]
async-trait = { workspace = true }
parking_lot = "0.12"

