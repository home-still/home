
[package]
name = "hs-scribe"
version = "0.1.0"
edition = "2021"

[features]
default = ["client"]
client = []
# Rasterising a page (`render`): pdfium's bitmap as an `image`. On its own
# for the binaries that draw pages and run no model (the docs service).
render = ["pdfium-render/image", "dep:image"]
server = [
    "render",
    "dep:axum",
    "dep:tempfile",
    "dep:ort",
    "dep:ndarray",
    "dep:oar-ocr",
    "dep:ollama-rs",
    "dep:base64",
    "dep:futures",
    "dep:tracing-subscriber",
    "dep:tokio-stream",
]
openssl-vendored = ["dep:openssl"]
cuda = ["server", "ort/cuda"]
eval = ["server", "dep:edit-distance"]

[dependencies]
# Client and Server
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tokio = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "stream"] }
figment = { workspace = true }
dirs = "6"
hs-common = { workspace = true, features = ["service", "storage-s3", "events-nats", "logging", "catalog", "auth", "catch-panic", "boxes"] }
async-trait = "0.1.92"
futures-util = "0.3"
unicode-segmentation = "1"
scraper = "0.22"
chrono = { workspace = true }
# The one PDF parser (page counting, text layer and rendering): libpdfium,
# bound at runtime. `thread_safe` serialises every pdfium call process-wide;
# the `image` feature (rasterising) is enabled by `render` only.
pdfium-render = { version = "0.8.35", default-features = false, features = ["pdfium_latest", "thread_safe"] }
bytes = "1"
# The EPUB reader (src/epub.rs): zip entries read under byte caps, package XML
# streamed as events (no tree), chapter markup walked by an iterative walker
# over scraper's tree (ego-tree is its traversal API).
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }
xml = "1"
ego-tree = "0.10"
html5ever = "0.29"
percent-encoding = "2"
libc = "0.2"

# Server Only
axum = { version = "0.8", optional = true, features = ["multipart"] }
tempfile = { version = "3", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
image = { version = "0.25", optional = true }
ort = { version = "=2.0.0-rc.11", features = ["ndarray"], optional = true }
# The words of a page that has no text layer (`word_ocr`): PP-OCRv5
# detection and recognition on ONNX Runtime. Pinned to the last release
# that builds on the `ort` above (`ort-sys` links one onnxruntime for the
# whole workspace): oar-ocr 0.6.2 onwards needs rc.12 or later.
oar-ocr = { version = "=0.6.1", default-features = false, optional = true }
ndarray = { version = "0.17", optional = true }
ollama-rs = { version = "0.3", features = ["stream"], optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
edit-distance = { version = "2.1", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[[bin]]
name = "hs-scribe-server"
path = "src/server_main.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"
serde_yaml_ng = "0.10"
# `Jail`: tests that set environment variables run serialised and restore them.
figment = { workspace = true, features = ["test"] }
