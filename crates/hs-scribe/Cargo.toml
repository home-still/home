
[package]
name = "hs-scribe"
version = "0.1.0"
edition = "2021"

[features]
default = ["client"]
client = []
server = [
    "dep:axum",
    "dep:tempfile",
    "pdfium-render/image",
    "dep:ort",
    "dep:ndarray",
    "dep:image",
    "dep:ollama-rs",
    "dep:base64",
    "dep:futures",
    "dep:tracing-subscriber",
    "dep:tokio-stream",
]
openssl-vendored = ["dep:openssl"]
cuda = ["server", "ort/cuda"]
eval = ["server", "dep:edit-distance"]

[dependencies]
# Client and Server
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tokio = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "stream"] }
figment = { workspace = true }
dirs = "6"
hs-common = { workspace = true, features = ["service", "storage-s3", "events-nats", "logging", "catalog", "auth", "catch-panic"] }
async-trait = "0.1"
futures-util = "0.3"
unicode-segmentation = "1"
scraper = "0.22"
chrono = { workspace = true }
epub = "2"
# The one PDF parser (page counting and rendering): libpdfium, bound at
# runtime. `thread_safe` serialises every pdfium call process-wide; the
# `image` feature (rasterising) is enabled by `server` only.
pdfium-render = { version = "0.8.35", default-features = false, features = ["pdfium_latest", "thread_safe"] }
bytes = "1"
# The EPUB reader's own zip version (epub 2.x pins 3.x, deflate only): used to
# measure an archive's real expanded size before any chapter is decompressed.
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

# Server Only
axum = { version = "0.8", optional = true, features = ["multipart"] }
tempfile = { version = "3", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
image = { version = "0.25", optional = true }
ort = { version = "=2.0.0-rc.11", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
ollama-rs = { version = "0.3", features = ["stream"], optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
edit-distance = { version = "2.1", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[[bin]]
name = "hs-scribe-server"
path = "src/server_main.rs"
required-features = ["server"]

[dev-dependencies]
tempfile = "3"
serde_yaml_ng = "0.10"
# `Jail`: tests that set environment variables run serialised and restore them.
figment = { workspace = true, features = ["test"] }
