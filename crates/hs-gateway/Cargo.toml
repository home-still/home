[package]
name = "hs-gateway"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hs-gateway"
path = "src/main.rs"

[dependencies]
hs-common = { workspace = true, features = ["auth", "service", "storage-s3", "logging"] }
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
figment = { workspace = true }
serde_yaml_ng = { workspace = true }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
# Already in the dependency tree (reqwest/axum/hmac); direct edges only.
url = "2"
subtle = "2"
futures-util = "0.3"
percent-encoding = "2"
parking_lot = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
